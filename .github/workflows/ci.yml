name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Os testes são de integração contra um Postgres real. Trocá-lo por um mock
    # invalidaria justamente o que eles verificam: date_trunc, funções de janela
    # e fronteiras de fuso são executados pelo banco, não pela aplicação.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://beacon:beacon@localhost:5433/beacon
      TEST_DATABASE_URL: postgres://beacon:beacon@localhost:5433/beacon_test
      JWT_SECRET: chave-de-ci-com-pelo-menos-32-caracteres-ok

    steps:
      - uses: actions/checkout@v4

      # Node 22: alguns pacotes da cadeia do @scalar/fastify-api-reference
      # declaram engines >= 22, e rodar abaixo disso enche o log de EBADENGINE.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O npm precisa ser o MESMO que gerou o package-lock.json.
      #
      # O lockfile deste projeto e escrito pelo npm 11. O npm 10 que vem com a
      # imagem do runner le a arvore de outro jeito e o `npm ci` falha de duas
      # formas opostas, dependendo de como o lockfile foi gerado: ou acusa
      # EBADPLATFORM tentando instalar o binario de AIX/PowerPC num runner
      # linux/x64, ou acusa "Missing from lock file" para os mesmos pacotes.
      #
      # Nenhum estado do lockfile agrada as duas versoes ao mesmo tempo, entao
      # a correcao e alinhar as versoes em vez de remendar o arquivo.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Migrations
        run: npm run db:migrate

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
